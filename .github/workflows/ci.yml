name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build-time only — no route connects to the DB during `next
          # build` (all routes are dynamic), and Prisma's codegen doesn't
          # need a live connection either. Real secrets live in Vercel.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          NEXT_PUBLIC_SUPABASE_URL: "https://ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "ci-dummy-key"

      - name: Unit tests
        run: npm test
        # No KV_REST_API_URL/TOKEN here — lib/rate-limit.test.ts's live-Redis
        # cases skip themselves (describe.skipIf) rather than failing.
